name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag_as_latest:
        description: 'Tag this build as :latest'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compute image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Semver tag push → vX.X.X + latest
            TAGS="${REPO}:${{ github.ref_name }}"$'\n'"${REPO}:latest"
          else
            # Manual dispatch → short SHA, optionally latest
            TAGS="${REPO}:${SHORT_SHA}"
            if [[ "${{ inputs.tag_as_latest }}" == "true" ]]; then
              TAGS="${TAGS}"$'\n'"${REPO}:latest"
            fi
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
